name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every commit on main keeps its own result, so a red main points at the commit
# that broke it; superseded pushes on a PR are not worth the minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build et tests
        run: dotnet test -c Release
